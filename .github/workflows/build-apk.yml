```yaml
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find Android project
        id: project
        shell: bash
        run: |
          FILE=$(find . -type f -name settings.gradle.kts \
            -not -path './.git/*' | head -n 1)

          if [ -z "$FILE" ]; then
            FILE=$(find . -type f -name settings.gradle \
              -not -path './.git/*' | head -n 1)
          fi

          if [ -z "$FILE" ]; then
            echo "ERROR: Cannot find settings.gradle or settings.gradle.kts"
            echo "Repository files:"
            find . -maxdepth 4 -type f | sort | head -n 200
            exit 1
          fi

          PROJECT_DIR=$(dirname "$FILE")
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Found Gradle project: $PROJECT_DIR"

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: luckeycount-debug-apk
          path: '**/build/outputs/apk/debug/app-debug.apk'
          if-no-files-found: error
```
